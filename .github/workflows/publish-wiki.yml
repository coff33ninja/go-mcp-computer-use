name: Publish Wiki

on:
  push:
    branches: [v0.2.x]
    paths:
      - wiki/**
      - scripts/gen-wiki.go
      - scripts/gen-tools-doc.go
      - .github/workflows/publish-wiki.yml

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki/ to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          strategy: clone
